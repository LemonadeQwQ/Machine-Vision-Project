name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check protocol dependencies
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          required = (
              'src/data/common.py', 'src/data/manifest.py',
              'src/data/prepare.py', 'src/data/deduplicate.py',
              'src/metadata_features.py', 'configs/schema/label_mapping.csv',
              'src/experiment.py', 'src/models/fusion.py', 'src/losses.py',
              'configs/experiments/base.yaml', 'configs/schema/pretrained_weights.json',
              'src/experiment_registry.py', 'src/models/factory.py',
              'src/models/foundation.py', 'src/models/next_stage.py',
              'src/infer.py', 'src/cross_validate.py', 'requirements-foundation.txt',
              'configs/experiments/E11_pair_gate.yaml',
              'configs/experiments/E12_pair_panderm.yaml',
              'configs/experiments/E13_pair_monet.yaml',
              'stages/panderm_stage/vendor/modeling_finetune.py',
              'stages/panderm_stage/vendor/SOURCE.md',
              'stages/monet_stage/reference/ATTRIBUTION.md',
              'stages/monet_stage/reference/MONET_LICENSE.txt',
          )
          missing = [name for name in required if not Path(name).is_file()]
          common = Path('src/data/common.py')
          if common.is_file():
              functions = {node.name for node in ast.parse(common.read_text(encoding='utf-8')).body
                           if isinstance(node, ast.FunctionDef)}
              if 'training_source_files' not in functions:
                  missing.append('A update: src/data/common.py::training_source_files')
          schema = Path('src/class_schema.py').read_text(encoding='utf-8')
          if 'NINE_CLASSES' not in schema or 'validate_class_order' not in schema:
              missing.append('updated src/class_schema.py')
          if missing:
              print('::error::Missing protocol dependencies (E11-E13 require A/B integration): ' + ', '.join(missing))
              raise SystemExit(1)
          PY
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run protocol and schema checks
        run: |
          python -B -m unittest discover -s tests -p test_resnet_protocol.py -v
          python -B -m unittest discover -s tests -p test_evaluation_schemas.py -v
          python -B -m unittest discover -s tests -p test_evaluate.py -v
          python -B -m unittest discover -s tests -p test_e11_e13.py -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
